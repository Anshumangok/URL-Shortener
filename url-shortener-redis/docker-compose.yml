version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  url-shortener:
    build: .
    container_name: url-shortener
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

